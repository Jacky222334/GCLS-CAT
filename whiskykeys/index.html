<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080914"><title>WhiskyKeys – Justus & Whisky</title><style>html,body{height:100%;margin:0;background:#080914;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.load{text-align:center;padding:28px}.cat{font-size:58px;animation:b .75s ease-in-out infinite alternate}.name{font-weight:900;font-size:clamp(24px,6vw,46px);margin-top:8px}.sub{opacity:.72;margin-top:6px}.bar{width:min(330px,72vw);height:8px;border-radius:999px;background:#252844;overflow:hidden;margin:22px auto 0}.bar:after{content:"";display:block;height:100%;width:40%;border-radius:inherit;background:linear-gradient(90deg,#7c5cff,#ff3da6,#00d4ff);animation:l 1s linear infinite}@keyframes l{from{transform:translateX(-110%)}to{transform:translateX(350%)}}@keyframes b{to{transform:translateY(-9px) rotate(4deg)}}.err{max-width:540px;line-height:1.45;color:#ffd2dc}</style></head><body><div class="load" id="load"><div class="cat">🐈‍⬛🎹</div><div class="name">WhiskyKeys</div><div class="sub">Justus & Whisky stimmen den Pfotenflügel …</div><div class="bar"></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Diese iPad-Browserversion ist zu alt. Bitte Safari bzw. iPadOS aktualisieren.');const names=['data-01.txt','data-02.txt','data-03.txt','data-04.txt','data-05.txt','data-06.txt','data-07.txt','data-08.txt','data-09.txt','data-10.txt','data-11.txt','data-12.txt','data-13.txt'];let b64='';for(const n of names){const r=await fetch(n,{cache:'force-cache'});if(!r.ok)throw new Error('Ressource '+n+' konnte nicht geladen werden.');b64+=(await r.text()).trim()}const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('load').innerHTML='<div class="cat">😿</div><div class="name">WhiskyKeys</div><p class="err">Die Pianorolle konnte nicht geladen werden.<br>'+String(e.message||e)+'</p>';console.error(e)}})();</script></body></html>
